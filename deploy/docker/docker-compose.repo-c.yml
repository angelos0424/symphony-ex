name: symphony-repo-c

services:
  symphony-repo-c:
    image: symphony-ex:hardening
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    container_name: symphony-repo-c
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    cpus: "1.0"
    mem_limit: 2g
    env_file:
      - ./env/common.env
      - ./env/repo-c.env
    # common.env supplies separate tracker and agent credentials.
    environment:
      SYMPHONY_WORKFLOW_PATH: /app/workflows/repo-c.WORKFLOW.md
      SYMPHONY_DASHBOARD_ENABLED: "false"
      SYMPHONY_STATE_ROOT: /var/lib/symphony/repo-c
    volumes:
      - ${SYMPHONY_CODEX_HOME}/auth.json:/run/host-codex/auth.json:ro
      - ${SYMPHONY_CODEX_HOME}/config.toml:/run/host-codex/config.toml:ro
      - ./workflows/repo-c.WORKFLOW.md:/app/workflows/repo-c.WORKFLOW.md:ro
      - repo_c_worktrees:/srv/symphony/repo-c/worktrees
      - repo_c_source_cache:/srv/symphony/repo-c/source-cache
      - repo_c_state:/var/lib/symphony/repo-c

volumes:
  repo_c_worktrees:
  repo_c_source_cache:
  repo_c_state:
